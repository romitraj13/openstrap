# Builds and tests the shared Kotlin code and the Swift app on a macOS runner.
# Android runs on the draft pull request; this workflow runs on the ios branch only so a
# commit does not pay for two macOS jobs.
name: iOS

on:
  push:
    branches: [ios]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # Card notes belong on the kanban board, not in the public repo. This fails the build if a
      # *SCRATCHPAD* file is ever committed, so the next one cannot slip through review; the same
      # pattern in .gitignore keeps it from being staged in the first place.
      - name: No scratchpad files are committed
        run: |
          tracked=$(git ls-files | grep -i 'SCRATCHPAD' || true)
          if [ -n "$tracked" ]; then
            echo "scratchpad files are committed:"
            echo "$tracked"
            echo "move the notes to the kanban board and git rm the file"
            exit 1
          fi
          echo "no scratchpad files are committed"

      # All networking lives in the Zepp sign-in screen (plan section 8: no network access outside
      # it). This fails the build if URLSession, WKWebView, NWConnection or URLRequest ever appears
      # in another Swift file, so later cards cannot add it elsewhere.
      - name: Networking stays in the Zepp sign-in screen
        run: |
          allowed='iosApp/OpenStrap/ZeppSignIn/'
          outside=$(grep -rlE 'URLSession|WKWebView|NWConnection|URLRequest' iosApp --include=*.swift | grep -v "^$allowed" || true)
          if [ -n "$outside" ]; then
            echo "networking code outside $allowed:"
            echo "$outside"
            exit 1
          fi
          echo "networking code is confined to $allowed"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Kotlin tests and XCFramework
        run: ./gradlew :protocol:iosSimulatorArm64Test :shared:iosSimulatorArm64Test :shared:assembleOpenStrapSharedDebugXCFramework

      # Gradle prints nothing per test for native targets, so the counts live only in the JUnit
      # XML. Print them here: the run log then states how many tests actually executed.
      - name: Summarize the Kotlin test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          paths = sorted(
              glob.glob("protocol/build/test-results/iosSimulatorArm64Test/*.xml")
              + glob.glob("shared/build/test-results/iosSimulatorArm64Test/*.xml")
          )
          if not paths:
              print("no JUnit XML found: the Kotlin tests did not run")
              sys.exit(1)

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for path in paths:
              suite = ET.parse(path).getroot()
              counts = {k: int(suite.get(k, 0)) for k in totals}
              for k in totals:
                  totals[k] += counts[k]
              print(
                  f"{suite.get('name')}: {counts['tests']} tests, "
                  f"{counts['failures']} failures, {counts['errors']} errors, "
                  f"{counts['skipped']} skipped"
              )
              for case in suite.iter("testcase"):
                  print(f"  - {case.get('name')}")

          print(
              "TOTAL iosSimulatorArm64Test: {tests} tests, {failures} failures, "
              "{errors} errors, {skipped} skipped".format(**totals)
          )
          sys.exit(1 if totals["failures"] or totals["errors"] else 0)
          PY

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: iosApp
        run: |
          cp Local.xcconfig.example Local.xcconfig
          xcodegen generate

      - name: Pick an iPhone simulator
        id: simulator
        run: |
          SIM_ID=$(python3 - <<'PY'
          import json
          import subprocess

          devices = json.loads(
              subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"])
          )["devices"]
          for runtime in sorted(devices):
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("no available iPhone simulator")
          PY
          )
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $SIM_ID"

      - name: Test
        working-directory: iosApp
        env:
          # Card U1: where the UI tests drop their screenshots, in case the runner's xcresulttool
          # has no `export attachments` subcommand.
          SCREENSHOT_DIR: ${{ github.workspace }}/iosApp/build/screens
        run: |
          # The Keychain only works from an app that carries the simulator's app-identifier
          # entitlement, which an unsigned build does not have (SecItemAdd then fails with
          # -34018). A simulator destination needs no team or provisioning profile, so the app is
          # signed ad hoc with the local identity instead.
          mkdir -p build/screens
          xcodebuild test \
            -project OpenStrap.xcodeproj \
            -scheme OpenStrap \
            -destination "id=${{ steps.simulator.outputs.id }}" \
            -resultBundlePath build/OpenStrap.xcresult \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual

      # The UI tests attach a screenshot per screen state. Export them from the .xcresult so
      # `iosApp/scripts/screens.py` can put them in docs/ios/screenshots/ (card U1, standing
      # instruction 8). Older Xcode has no `export attachments`; the tests then wrote the same
      # PNGs to SCREENSHOT_DIR, so the artifact is filled either way.
      - name: Export the UI test screenshots
        if: always()
        working-directory: iosApp
        run: |
          mkdir -p build/screens
          if xcrun xcresulttool export attachments --path build/OpenStrap.xcresult --output-path build/screens; then
            echo "exported the attachments from build/OpenStrap.xcresult"
          else
            echo "xcresulttool export attachments is unavailable; using the PNGs the UI tests wrote to SCREENSHOT_DIR"
          fi
          find build/screens -name '*.png' -print | sort | head -60
          echo "png count: $(find build/screens -name '*.png' | wc -l)"

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screens
          path: iosApp/build/screens
          if-no-files-found: warn

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: OpenStrap.xcresult
          path: iosApp/build/OpenStrap.xcresult
          if-no-files-found: warn
