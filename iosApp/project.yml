name: OpenStrap

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Base.xcconfig
  Release: Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic

targets:
  OpenStrap:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OpenStrap
        excludes:
          - Info.plist
          - OpenStrap.entitlements
    # The bundle's Info.plist is generated from here (card U1 moved the old hand-written
    # file into this block), so the font registration and the usage descriptions have one
    # source of truth. UIAppFonts names the files as they land in the bundle: resources are
    # copied to the bundle root, so the Design/Fonts/ folder is not part of the name.
    info:
      path: OpenStrap/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: OpenStrap connects to your Amazfit Helio Strap over Bluetooth to read your heart rate and sync your history.
        NSHealthUpdateUsageDescription: OpenStrap writes your heart rate, sleep and activity to Apple Health.
        UIBackgroundModes:
          - bluetooth-central
        # Card U1: the three variable fonts the glow design system sets type in
        # (app/src/main/res/font/*.ttf).
        UIAppFonts:
          - funnel_display.ttf
          - funnel_sans.ttf
          - museo_moderno.ttf
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: OpenStrap/OpenStrap.entitlements
        # Kotlin's static framework needs the system libraries it links through platform libs:
        # zlib (platform.zlib) and Security (SecRandomCopyBytes). A static framework does not
        # carry those linker flags into the app.
        OTHER_LDFLAGS:
          - $(inherited)
          - -lz
          - -framework
          - Security
      configs:
        # The unit tests use `@testable import OpenStrap` to reach the Keychain store and the UUID
        # mapping, so the Debug build has to be built for testing.
        Debug:
          ENABLE_TESTABILITY: YES
    dependencies:
      - framework: ../shared/build/XCFrameworks/debug/OpenStrapShared.xcframework
        embed: false
        codeSign: false

  OpenStrapTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OpenStrapTests
    dependencies:
      - target: OpenStrap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.example.openstrap.OpenStrapTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OpenStrap.app/OpenStrap
        BUNDLE_LOADER: $(TEST_HOST)

  OpenStrapUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OpenStrapUITests
    dependencies:
      - target: OpenStrap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.example.openstrap.OpenStrapUITests
        TEST_TARGET_NAME: OpenStrap

schemes:
  OpenStrap:
    build:
      targets:
        OpenStrap: all
        OpenStrapTests: [test]
        OpenStrapUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: OpenStrapTests
          parallelizable: false
        - name: OpenStrapUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
